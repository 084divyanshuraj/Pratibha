openapi: 3.0.3
info:
  title: Smart Campus Analytics API
  description: Backend REST API for Smart Campus Analytics (KPMG Challenge)
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Local development server
  - url: https://smart-campus-backend.onrender.com
    description: Production Render service

paths:
  /health/live:
    get:
      summary: Liveness probe
      description: Returns process liveness and uptime. Publicly accessible without authentication.
      responses:
        '200':
          description: Process is alive and accepting connections
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: "ok"
                      uptimeSeconds:
                        type: integer
                        example: 42
                      timestamp:
                        type: string
                        format: date-time
                  meta:
                    $ref: '#/components/schemas/Meta'

  /health/ready:
    get:
      summary: Readiness probe
      description: Returns dependency readiness (database, external services). Safe status without secrets.
      responses:
        '200':
          description: All critical dependencies are healthy and ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessSuccess'
        '503':
          description: One or more critical dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessFailure'

  /api/v1:
    get:
      summary: API v1 root information
      description: Returns service metadata and API version.
      responses:
        '200':
          description: API v1 status and metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                        example: "Smart Campus Analytics API"
                      version:
                        type: string
                        example: "v1"
                      status:
                        type: string
                        example: "active"
                  meta:
                    $ref: '#/components/schemas/Meta'

  /api/v1/auth/login:
    post:
      summary: User Login
      description: Verifies user credentials and returns JWT access token with profile DTO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "faculty@example.edu"
                password:
                  type: string
                  format: password
                  example: "DemoFaculty123!"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/LoginResult'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          description: Invalid credentials or deactivated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/me:
    get:
      summary: Current Authenticated User Profile
      description: Returns profile and permissions of the currently authenticated user.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/UserDTO'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/institution/users:
    post:
      summary: Admin User Provisioning
      description: Allows administrator to provision new accounts with bcrypt hashed passwords.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - displayName
                - role
              properties:
                email:
                  type: string
                  format: email
                  example: "newfaculty@example.edu"
                password:
                  type: string
                  minLength: 8
                  example: "StrongPass123!"
                displayName:
                  type: string
                  example: "Dr. New Faculty"
                role:
                  type: string
                  enum: [admin, faculty, placement_officer, student]
                  example: "faculty"
                studentId:
                  type: string
                  nullable: true
                  example: null
      responses:
        '201':
          description: User provisioned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/UserDTO'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '403':
          description: Forbidden - admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/students:
    get:
      summary: List students with pagination and filters
      description: Accessible by staff roles (admin, faculty, placement_officer). Filter by department, semester, cohort, status, or search query.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: department
          schema:
            type: string
        - in: query
          name: semester
          schema:
            type: integer
        - in: query
          name: cohort
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive, graduated, suspended]
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of student profiles
        '403':
          description: Forbidden - staff role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create student profile
      description: Admin-only. Creates a new student record with unique uppercase studentId.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, firstName, lastName, department, program, semester, enrollmentYear]
              properties:
                studentId:
                  type: string
                  example: "STU_2024_001"
                firstName:
                  type: string
                  example: "Aarav"
                lastName:
                  type: string
                  example: "Sharma"
                department:
                  type: string
                  example: "Computer Science"
                program:
                  type: string
                  example: "B.Tech CSE"
                semester:
                  type: integer
                  example: 6
                enrollmentYear:
                  type: integer
                  example: 2021
      responses:
        '201':
          description: Student profile created successfully
        '409':
          description: Conflict - studentId already exists

  /api/v1/students/{studentId}:
    get:
      summary: Get student profile
      description: Accessible by staff or the owning student.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: studentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Student profile retrieved
        '403':
          description: Forbidden - student cannot access other student profiles
        '404':
          description: Student not found

    patch:
      summary: Update student profile
      description: Admin and faculty only. Updates allowed fields. studentId is immutable.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: studentId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                status:
                  type: string
                  enum: [active, inactive, graduated, suspended]
      responses:
        '200':
          description: Student profile updated
        '400':
          description: Validation error or attempt to modify studentId

  /api/v1/students/{studentId}/records:
    get:
      summary: Get student integrated category records
      description: Accessible by staff or owning student. Returns records across all 7 categories. Students cannot see staff_only feedback.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: studentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Aggregated category records and counts

  /api/v1/students/{studentId}/success-score:
    get:
      summary: Get Student Success Score
      description: Staff roles or owner student. Returns latest deterministic composite indicator with components, drivers, and missing fields.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: studentId
          required: true
          schema:
            type: string
        - in: query
          name: period
          schema:
            type: string
            default: "current"
      responses:
        '200':
          description: Student Success Score retrieved successfully
        '403':
          description: Forbidden - student cannot access other student scores
        '404':
          description: Student not found

  /api/v1/students/{studentId}/success-score/recalculate:
    post:
      summary: Recalculate Student Success Score
      description: Staff only (admin, faculty, placement_officer). Recalculates and persists fresh score snapshot.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: studentId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                period:
                  type: string
                  default: "current"
      responses:
        '200':
          description: Student Success Score recalculated and persisted
        '403':
          description: Forbidden - staff role required

  /api/v1/students/{studentId}/predictions:
    get:
      summary: Get student ML risk predictions
      description: Staff roles or owning student. Returns latest active predictions for academic_risk and placement_risk.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: studentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Latest predictions retrieved successfully
        '403':
          description: Forbidden - student cannot access other student predictions
        '404':
          description: Student not found

    post:
      summary: Generate fresh ML risk predictions
      description: Staff only (admin, faculty, placement_officer). Builds 17 features as-of date, invokes external ML service, validates, and persists without fabrication.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: studentId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
                  enum: [academic_risk, placement_risk, all]
                  default: "academic_risk"
                asOfDate:
                  type: string
                  format: date-time
      responses:
        '201':
          description: ML risk prediction generated and persisted
        '403':
          description: Forbidden - staff role required
        '503':
          description: ML service unavailable or offline

  /api/v1/imports/{datasetType}/preview:
    post:
      summary: Dry-run preview import
      description: Admin only. Validates CSV or JSON dataset without persisting records.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: datasetType
          required: true
          schema:
            type: string
            enum: [academic, attendance, lms, engagement, placement, skills, feedback, students]
      responses:
        '200':
          description: Validation preview report with counts and row errors

  /api/v1/imports/{datasetType}:
    post:
      summary: Batch commit dataset import
      description: Admin only. Validates and persists accepted records, tags with sourceImportId, and creates Import record.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: datasetType
          required: true
          schema:
            type: string
            enum: [academic, attendance, lms, engagement, placement, skills, feedback, students]
      responses:
        '201':
          description: Batch import completed with status and counts

  /api/v1/imports/{importId}:
    get:
      summary: Get import status and row error report
      description: Admin only. Returns details of an executed import job.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: importId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Import record details
        '404':
          description: Import not found

components:
  schemas:
    Meta:
      type: object
      required:
        - requestId
      properties:
        requestId:
          type: string
          example: "req_f81d4fae-7dec-11d0-a765-00a0c91e6bf6"

    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          example: "email"
        message:
          type: string
          example: "Must be a valid educational email"

    ErrorResponse:
      type: object
      required:
        - success
        - error
        - meta
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: "VALIDATION_ERROR"
            message:
              type: string
              example: "Request validation failed"
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
        meta:
          $ref: '#/components/schemas/Meta'

    ReadinessSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            ready:
              type: boolean
              example: true
            status:
              type: string
              example: "ready"
            checks:
              type: object
              additionalProperties:
                type: object
                properties:
                  status:
                    type: string
                    example: "connected"
                  ready:
                    type: boolean
                    example: true
            timestamp:
              type: string
              format: date-time
        meta:
          $ref: '#/components/schemas/Meta'

    ReadinessFailure:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          type: object
          properties:
            ready:
              type: boolean
              example: false
            status:
              type: string
              example: "not_ready"
            checks:
              type: object
              additionalProperties:
                type: object
                properties:
                  status:
                    type: string
                    example: "disconnected"
                  ready:
                    type: boolean
                    example: false
            timestamp:
              type: string
              format: date-time
        meta:
          $ref: '#/components/schemas/Meta'

    UserDTO:
      type: object
      properties:
        id:
          type: string
          example: "65f01e2b4f1b2c001f3a5e89"
        email:
          type: string
          format: email
          example: "faculty@example.edu"
        displayName:
          type: string
          example: "Dr. Jane Doe"
        role:
          type: string
          enum: [admin, faculty, placement_officer, student]
          example: "faculty"
        studentId:
          type: string
          nullable: true
          example: null
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LoginResult:
      type: object
      properties:
        accessToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        tokenType:
          type: string
          example: "Bearer"
        expiresIn:
          type: string
          example: "7d"
        user:
          $ref: '#/components/schemas/UserDTO'

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
